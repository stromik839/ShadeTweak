name: Build ShadeTweak APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # по умолчанию ставится пакет "tools", которого в репозитории SDK
          # больше нет -> sdkmanager падает. Платформу и build-tools AGP
          # докачает сам.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # debug-варіант підписується автоматично дефолтним debug-ключем -
      # можна одразу ставити на телефон без ручного підпису apk
      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadeTweak-apk
          path: app/build/outputs/apk/debug/*.apk
